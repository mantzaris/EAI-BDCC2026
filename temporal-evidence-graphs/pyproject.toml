[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-evidence"
version = "0.1.0"
description = "Reproducible temporal evidence maintenance study"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6", "scipy==1.15.3", "pandas==2.2.3", "pyarrow==20.0.0",
  "pydantic==2.11.7", "PyYAML==6.0.2", "httpx==0.28.1", "neo4j==5.28.2",
  "matplotlib==3.10.3", "networkx==3.4.2", "pytest==8.4.1",
]

[project.optional-dependencies]
gpu = ["vllm==0.10.2", "transformers==4.55.2", "huggingface-hub==0.34.4", "cupy-cuda12x==13.6.0"]
dashboard = ["streamlit==1.49.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
