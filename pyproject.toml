[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-risk-twins"
version = "0.1.0"
description = "Retained local information and graph enclosures for sustained traffic-risk forecasts"
requires-python = ">=3.8"
dependencies = ["numpy>=1.22", "scipy>=1.7", "pandas>=1.3", "scikit-learn>=1.0", "PyYAML>=5.3", "matplotlib>=3.1", "h5py>=3", "threadpoolctl>=2.2"]

[project.optional-dependencies]
gpu = ["torch>=2.8"]
test = ["pytest>=8"]

[project.scripts]
traffic-risk = "traffic_risk_twins.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
